<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
    <linearGradient id="lm-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0A1624" stroke="url(#lm-grad)" stroke-width="2.5" />
  <rect x="12" y="12" width="76" height="76" rx="18" fill="url(#lm-glow)" />

  <!-- Abstract Ledger Blocks & M Network Grid -->
  <!-- Left Pillar -->
  <path d="M28 68V34L44 48V76L28 68Z" fill="url(#lm-grad)" opacity="0.95" />
  <!-- Center Node Diamond -->
  <path d="M50 24L64 36L50 48L36 36L50 24Z" fill="#00E5FF" filter="url(#glow-blur)" />
  <!-- Right Pillar -->
  <path d="M72 68V34L56 48V76L72 68Z" fill="url(#lm-grad)" opacity="0.95" />
  <!-- Dynamic Connecting Nodes -->
  <circle cx="50" cy="36" r="4" fill="#FFFFFF" />
  <circle cx="28" cy="34" r="3" fill="#00E5FF" />
  <circle cx="72" cy="34" r="3" fill="#00F5A0" />
  <circle cx="50" cy="62" r="3.5" fill="#3B82F6" />

  <!-- Micro Grid Overlay Lines -->
  <line x1="28" y1="34" x2="50" y2="36" stroke="#00E5FF" stroke-width="1.5" opacity="0.8" />
  <line x1="72" y1="34" x2="50" y2="36" stroke="#00F5A0" stroke-width="1.5" opacity="0.8" />
  <line x1="36" y1="48" x2="50" y2="62" stroke="#3B82F6" stroke-width="1.5" opacity="0.8" />
  <line x1="64" y1="48" x2="50" y2="62" stroke="#3B82F6" stroke-width="1.5" opacity="0.8" />
</svg>
